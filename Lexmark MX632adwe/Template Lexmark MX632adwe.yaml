zabbix_export:
  version: '6.0'
  groups:
    -
      uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    -
      uuid: d1c2b3a4e5f647a18000000000000000
      template: 'SNMP - Lexmark MX632adwe'
      name: 'SNMP - Lexmark MX632adwe'
      description: |
        ## Visão Geral
        
        Template Zabbix **SNMP** para a impressora Lexmark modelo **Lexmark MX632adwe**
        
        Nota: Este template foi traduzido para Português e modificado para incluir os valores de Toner, Unidade de Imagem e Kit de Manutenção em Porcentagem (%). Alertas configurados para <= 15%.
        
        No momento, o template monitora as informações básicas da máquina, módulos de impressão e realiza testes de ping para garantir sua disponibilidade.

        Desenvolvido por Fernando Aranha - fernando@aranha.eti.br
      groups:
        -
          name: Templates
      items:
        # ================= INFORMAÇÕES GERAIS =================
        -
          uuid: d1c2b3a4e5f647a18000000000000001
          name: 'Fabricante do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.8.2.1.14.1.1
          key: deviceManufacturer
          delay: '3600'
          history: 7d
          trends: '0'
          status: DISABLED
          value_type: CHAR
          description: 'Identificação do fabricante.'
          inventory_link: VENDOR
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000002
          name: '01 Modelo do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: hrDeviceDescr.1
          key: deviceModel
          delay: '30'
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000003
          name: 'Ping da Impressora'
          type: SIMPLE
          key: 'icmpping[,5,,,]'
          delay: 120s
          trends: 90d
          tags:
            - { tag: Application, value: Printer }
          triggers:
            -
              uuid: d1c2b3a4e5f647a18000000000000004
              expression: 'last(/SNMP - Lexmark MX632adwe/icmpping[,5,,,])=0'
              name: 'Impressora {HOST.NAME} Inacessível'
              priority: HIGH
              description: 'Alarme acionado se a impressora não responder a 5 pacotes de ping'
              manual_close: 'YES'
        -
          uuid: d1c2b3a4e5f647a18000000000000005
          name: '05 Número de Série do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.5.1.1.17.1
          key: serialNumber
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: SERIALNO_A
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000006
          name: '03 Contato do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysContact.0'
          key: sysContact
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Identificação textual do contato do dispositivo.'
          inventory_link: CONTACT
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000007
          name: 'Descrição do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysDescr.0'
          key: sysDescr
          delay: '3600'
          history: 7d
          trends: '0'
          status: DISABLED
          value_type: CHAR
          inventory_link: HARDWARE
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000008
          name: '02 Localização do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysLocation.0'
          key: sysLocation
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'A localização física deste nó (ex.: Sala de TI, 3º Andar).'
          inventory_link: LOCATION
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a18000000000000009
          name: '04 Nome do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysName.0'
          key: sysName
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Nome administrativamente atribuído a este dispositivo.'
          inventory_link: NAME
          tags:
            - { tag: Application, value: General }
        -
          uuid: d1c2b3a4e5f647a1800000000000000a
          name: '06 Tempo de Atividade (Uptime)'
          type: SNMP_AGENT
          snmp_oid: 'DISMAN-EVENT-MIB::sysUpTimeInstance'
          key: sysUpTime
          delay: '60'
          units: uptime
          description: 'Tempo desde que a máquina foi ligada/reiniciada.'
          preprocessing:
            -
              type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - { tag: Application, value: General }
          triggers:
            -
              uuid: d1c2b3a4e5f647a1800000000000000b
              expression: 'change(/SNMP - Lexmark MX632adwe/sysUpTime)<0'
              name: 'Impressora {HOST.NAME} reiniciada'
              priority: INFO
        -
          uuid: d1c2b3a4e5f647a1800000000000000c
          name: 'Contador de Páginas'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.10.2.1.4.1.1
          key: prtMarkerLifeCount
          delay: '60'
          trends: '0'
          value_type: LOG
          tags:
            - { tag: Application, value: Printer }
        -
          uuid: d1c2b3a4e5f647a1800000000000000d
          name: 'Status da Impressora'
          type: SNMP_AGENT
          snmp_oid: hrPrinterStatus.1
          key: prtConsoleDescription
          delay: '60'
          value_type: UNSIGNED
          valuemap:
            name: 'Printer Status'
          tags:
            - { tag: Application, value: Printer }

        # ================= TONER PRETO =================
        -
          uuid: d1c2b3a4e5f647a1800000000000000e
          name: 'Nível do Toner (Cartucho Preto)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.2
          key: prtMarkerSuppliesLevel
          delay: '60'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: d1c2b3a4e5f647a1800000000000000f
          name: 'Capacidade do Toner (Cartucho Preto)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.2
          key: prtMarkerSuppliesMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: d1c2b3a4e5f647a18000000000000010
          name: 'Porcentagem do Toner (Preto)'
          type: CALCULATED
          key: toner_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel) / last(//prtMarkerSuppliesMaxCapacity) * 100'
          tags:
            - { tag: Application, value: Toners }
          triggers:
            -
              uuid: d1c2b3a4e5f647a18000000000000011
              expression: 'last(/SNMP - Lexmark MX632adwe/toner_percentage)<=15'
              name: '{HOST.NAME} - Nível de Toner PRETO baixo (<= 15%)'
              priority: WARNING

        # ================= UNIDADE DE IMAGEM =================
        -
          uuid: d1c2b3a4e5f647a18000000000000012
          name: 'Nível da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ImagingUnitCurrentLevel
          delay: '60'
          tags:
            - { tag: Application, value: Imaging }
        -
          uuid: d1c2b3a4e5f647a18000000000000013
          name: 'Capacidade da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ImagingUnitMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            - { tag: Application, value: Imaging }
        -
          uuid: d1c2b3a4e5f647a18000000000000014
          name: 'Porcentagem da Unidade de Imagem'
          type: CALCULATED
          key: imaging_unit_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//ImagingUnitCurrentLevel) / last(//ImagingUnitMaxCapacity) * 100'
          tags:
            - { tag: Application, value: Imaging }
          triggers:
            -
              uuid: d1c2b3a4e5f647a18000000000000015
              expression: 'last(/SNMP - Lexmark MX632adwe/imaging_unit_percentage)<=15'
              name: '{HOST.NAME} - Unidade de Imagem no fim (<= 15%)'
              priority: WARNING

        # ================= KIT DE MANUTENÇÃO =================
        -
          uuid: d1c2b3a4e5f647a18000000000000016
          name: 'Nível do Kit de Manutenção'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.3
          key: MaintenanceKitCurrentLevel
          delay: '60'
          tags:
            - { tag: Application, value: Maintenance }
        -
          uuid: d1c2b3a4e5f647a18000000000000017
          name: 'Capacidade do Kit de Manutenção'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.3
          key: MaintenanceKitMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            - { tag: Application, value: Maintenance }
        -
          uuid: d1c2b3a4e5f647a18000000000000018
          name: 'Porcentagem do Kit de Manutenção'
          type: CALCULATED
          key: maintenance_kit_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//MaintenanceKitCurrentLevel) / last(//MaintenanceKitMaxCapacity) * 100'
          tags:
            - { tag: Application, value: Maintenance }
          triggers:
            -
              uuid: d1c2b3a4e5f647a18000000000000019
              expression: 'last(/SNMP - Lexmark MX632adwe/maintenance_kit_percentage)<=15'
              name: '{HOST.NAME} - Kit de Manutenção no fim (<= 15%)'
              priority: WARNING
      valuemaps:
        -
          uuid: d1c2b3a4e5f647a1800000000000001a
          name: 'Printer Status'
          mappings:
            -
              value: '1'
              newvalue: 'Outro'
            -
              value: '2'
              newvalue: 'Desconhecido'
            -
              value: '3'
              newvalue: 'Pronta / Ociosa'
            -
              value: '4'
              newvalue: 'Imprimindo'
            -
              value: '5'
              newvalue: 'Aquecendo'
  graphs:
    -
      uuid: d1c2b3a4e5f647a1800000000000001b
      name: 'Nível do Toner (Porcentagem)'
      graph_items:
        -
          color: 00C800
          item:
            host: 'SNMP - Lexmark MX632adwe'
            key: toner_percentage
