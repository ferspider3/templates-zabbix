zabbix_export:
  version: '6.0'
  groups:
    -
      uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    -
      uuid: a0000000000040008000000000000000
      template: 'SNMP - Lexmark CX951se'
      name: 'SNMP - Lexmark CX951se'
      description: |
        Template Zabbix SNMP para a impressora Lexmark CX951se.
        OIDs mapeadas sob medida (Toners, Unidades de Imagem e Recipiente de Resíduos) com alertas em 15%.
        Status da impressora com Mapeamento de Valor.

        Desenvolvido por Fernando Aranha - fernando@aranha.eti.br
      groups:
        -
          name: Templates
      items:
        # ================= INFORMAÇÕES GERAIS =================
        -
          uuid: a0000000000040008000000000000001
          name: '01 Modelo do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: hrDeviceDescr.1
          key: deviceModel
          delay: '60'
          value_type: CHAR
          tags:
            - { tag: Application, value: General }
        -
          uuid: a0000000000040008000000000000002
          name: 'Ping da Impressora'
          type: SIMPLE
          key: 'icmpping[,5,,,]'
          delay: 120s
          tags:
            - { tag: Application, value: General }
        -
          uuid: a0000000000040008000000000000003
          name: 'Status da Impressora'
          type: SNMP_AGENT
          snmp_oid: hrPrinterStatus.1
          key: prtConsoleDescription
          delay: '60'
          value_type: UNSIGNED
          valuemap:
            name: 'Printer Status'
          tags:
            - { tag: Application, value: Printer }

        # ================= 1. TONER PRETO =================
        -
          uuid: a0000000000040008000000000000004
          name: 'Nível do Cartucho Preto'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.1
          key: prtMarkerSuppliesLevel_Black
          delay: '60'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000005
          name: 'Capacidade do Cartucho Preto'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.1
          key: prtMarkerSuppliesMaxCapacity_Black
          delay: '3600'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000006
          name: 'Porcentagem do Cartucho Preto'
          type: CALCULATED
          key: toner_percentage_black
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Black) / last(//prtMarkerSuppliesMaxCapacity_Black) * 100'
          tags:
            - { tag: Application, value: Toners }
          triggers:
            -
              uuid: a0000000000040008000000000000029
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_black)<=15'
              name: '{HOST.NAME} - Nível de Toner PRETO baixo (<= 15%)'
              priority: WARNING

        # ================= 2. TONER CIANO =================
        -
          uuid: a0000000000040008000000000000007
          name: 'Nível do Cartucho Ciano'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.2
          key: prtMarkerSuppliesLevel_Cyan
          delay: '60'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000008
          name: 'Capacidade do Cartucho Ciano'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.2
          key: prtMarkerSuppliesMaxCapacity_Cyan
          delay: '3600'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000009
          name: 'Porcentagem do Cartucho Ciano'
          type: CALCULATED
          key: toner_percentage_cyan
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Cyan) / last(//prtMarkerSuppliesMaxCapacity_Cyan) * 100'
          tags:
            - { tag: Application, value: Toners }
          triggers:
            -
              uuid: a000000000004000800000000000002a
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_cyan)<=15'
              name: '{HOST.NAME} - Nível de Toner CIANO baixo (<= 15%)'
              priority: WARNING

        # ================= 3. TONER MAGENTA =================
        -
          uuid: a0000000000040008000000000000010
          name: 'Nível do Cartucho Magenta'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.3
          key: prtMarkerSuppliesLevel_Magenta
