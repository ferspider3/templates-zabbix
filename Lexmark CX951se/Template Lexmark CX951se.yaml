          triggers:
            -
              uuid: a000000000004000800000000000002e
              expression: 'last(/SNMP - Lexmark CX951se/imag_kit_color_percentage)<=15'
              name: '{HOST.NAME} - Kit de Imagem Colorida no fim (<= 15%)'
              priority: WARNING

        # ================= 10. RESÍDUOS DE TONER =================
        -
          uuid: a0000000000040008000000000000025
          name: 'Nível Recipiente de Resíduos'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.10
          key: WasteToner_Level
          delay: '60'
          tags:
            - { tag: Application, value: Maintenance }
        -
          uuid: a0000000000040008000000000000026
          name: 'Capacidade Recipiente Resíduos'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.10
          key: WasteToner_Capacity
          delay: '3600'
          tags:
