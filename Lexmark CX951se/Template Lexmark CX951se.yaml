zabbix_export:
  version: '7.0'
  date: '2026-10-20T10:00:00Z'
  groups:
    -
      uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    -
      uuid: 50a553a7ef6443078a82fa79d862649c
      template: 'SNMP - Lexmark CX951se'
      name: 'SNMP - Lexmark CX951se'
      description: |
        ## Visão Geral
        
        Template Zabbix **SNMP** para a impressora Lexmark modelo **Lexmark CX951se (Colorida)**
        
        Inclui monitoramento dos 4 Toners (Preto, Ciano, Magenta e Amarelo) com cálculo automático de porcentagem, além de Unidade de Imagem, Kit de Manutenção e dados gerais do equipamento.

        Desenvolvido por Fernando Aranha - fernando@aranha.eti.br
        
      groups:
        -
          name: Templates
      items:
        -
          uuid: 2d23aadc53fe42f88e426f5cdf8b2b53
          name: 'Fabricante do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.8.2.1.14.1.1
          key: deviceManufacturer
          delay: '3600'
          history: 7d
          trends: '0'
          status: DISABLED
          value_type: CHAR
          description: 'Identificação do fabricante.'
          inventory_link: VENDOR
          tags:
            -
              tag: Application
              value: General
        -
          uuid: c03671da59e84397a1f85c72d77da716
          name: '01 Modelo do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: hrDeviceDescr.1
          key: deviceModel
          delay: '30'
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          tags:
            -
              tag: Application
              value: General
        -
          uuid: 25609a332f11418ca3b3c8d3b3eaa511
          name: 'Ping da Impressora'
          type: SIMPLE
          key: 'icmpping[,5,,,]'
          delay: 120s
          trends: 90d
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: 3436e095a898479b9b91c1ae5f482bc4
              expression: 'last(/SNMP - Lexmark CX951se/icmpping[,5,,,])=0'
              name: 'Impressora {HOST.NAME} Inacessível'
              priority: HIGH
              description: 'Alarme acionado se a impressora não responder a 5 pacotes de ping'
              manual_close: 'YES'
        -
          uuid: cd2b62d405a64b319c3531a2142cb5da
          name: 'Nível da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ImagingUnitCurrentLevel
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: 6edf1830696e44798be10832ca734f22
              expression: 'last(/SNMP - Lexmark CX951se/ImagingUnitCurrentLevel)<22500'
              name: '{HOST.NAME} - Substituir Unidade de Imagem'
              priority: WARNING
        -
          uuid: 7ddfbc671e0d49d4a5e9e355aae8f4ac
          name: 'Capacidade da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ImagingUnitMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: 3a2b1c4d5e6f4a7b8c9d0e1f2a3b4c5d
          name: 'Porcentagem da Unidade de Imagem'
          type: CALCULATED
          key: imaging_unit_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//ImagingUnitCurrentLevel) / last(//ImagingUnitMaxCapacity) * 100'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: 8dce7e9e34b442e7893f453cea172eda
          name: 'Nível do Kit de Manutenção'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.3
          key: MaintenanceKitCurrentLevel
