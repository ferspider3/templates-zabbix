          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.4
          key: prtMarkerSuppliesMaxCapacity_Yellow
          delay: '3600'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000015
          name: 'Porcentagem do Cartucho Amarelo'
          type: CALCULATED
          key: toner_percentage_yellow
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Yellow) / last(//prtMarkerSuppliesMaxCapacity_Yellow) * 100'
          tags:
            - { tag: Application, value: Toners }
          triggers:
            -
              uuid: a000000000004000800000000000002c
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_yellow)<=15'
              name: '{HOST.NAME} - Nível de Toner AMARELO baixo (<= 15%)'
              priority: WARNING

        # ================= 14. UNID. CRIAÇÃO IMAGEM PRETA =================
        -
          uuid: a0000000000040008000000000000019
          name: 'Nível da Unid. Imag. Preta'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.14
          key: ImagUnit_Black_Level
          delay: '60'
          tags:
            - { tag: Application, value: Imaging }
        -
          uuid: a0000000000040008000000000000020
          name: 'Capacidade da Unid. Imag. Preta'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.14
          key: ImagUnit_Black_Capacity
          delay: '3600'
          tags:
            - { tag: Application, value: Imaging }
        -
          uuid: a0000000000040008000000000000021
