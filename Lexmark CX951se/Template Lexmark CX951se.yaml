              name: '{HOST.NAME} - Unidade de Imagem Preta no fim (<= 15%)'
              priority: WARNING

        # ================= 15. KIT GERAÇÃO IMAGEM COLOR =================
        -
          uuid: a0000000000040008000000000000022
          name: 'Nível do Kit Imag. Coloridas'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.15
          key: ImagKit_Color_Level
          delay: '60'
          tags:
            - { tag: Application, value: Imaging }
        -
          uuid: a0000000000040008000000000000023
          name: 'Capacidade Kit Imag. Coloridas'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.15
