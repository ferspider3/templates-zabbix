              expression: 'last(/SNMP - Lexmark CX951se/waste_toner_percentage)<=15'
              name: '{HOST.NAME} - Trocar Recipiente de Resíduos (Atingiu 15%)'
              priority: WARNING
      valuemaps:
        -
          uuid: a0000000000040008000000000000030
          name: 'Printer Status'
          mappings:
            -
              value: '1'
              newvalue: 'Outro'
            -
              value: '2'
              newvalue: 'Desconhecido'
            -
              value: '3'
              newvalue: 'Pronta / Ociosa'
            -
              value: '4'
              newvalue: 'Imprimindo'
            -
              value: '5'
              newvalue: 'Aquecendo'
  graphs:
    -
      uuid: a0000000000040008000000000000028
      name: 'Níveis dos Toners (Porcentagem)'
      graph_items:
        -
          color: '000000'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_black
        -
          sortorder: '1'
          color: '00FFFF'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_cyan
        -
          sortorder: '2'
          color: 'FF00FF'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_magenta
        -
          sortorder: '3'
          color: 'FFFF00'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_yellow
