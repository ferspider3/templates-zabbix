          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000011
          name: 'Capacidade do Cartucho Magenta'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.3
          key: prtMarkerSuppliesMaxCapacity_Magenta
          delay: '3600'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000012
          name: 'Porcentagem do Cartucho Magenta'
          type: CALCULATED
          key: toner_percentage_magenta
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Magenta) / last(//prtMarkerSuppliesMaxCapacity_Magenta) * 100'
          tags:
            - { tag: Application, value: Toners }
          triggers:
            -
              uuid: a000000000004000800000000000002b
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_magenta)<=15'
              name: '{HOST.NAME} - Nível de Toner MAGENTA baixo (<= 15%)'
              priority: WARNING

        # ================= 4. TONER AMARELO =================
        -
          uuid: a0000000000040008000000000000013
          name: 'Nível do Cartucho Amarelo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.4
          key: prtMarkerSuppliesLevel_Yellow
          delay: '60'
          tags:
            - { tag: Application, value: Toners }
        -
          uuid: a0000000000040008000000000000014
