zabbix_export:
  version: '6.0'
  groups:
    -
      uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    -
      uuid: f8a4b3c2d1e0489ab000000000000000
      template: 'SNMP - Lexmark CX951se'
      name: 'SNMP - Lexmark CX951se'
      description: |
        ## Visão Geral
        
        Template Zabbix **SNMP** para a impressora Lexmark modelo **Lexmark CX951se (Colorida)**
        
        Inclui monitoramento dos 4 Toners (Preto, Ciano, Magenta e Amarelo) com cálculo automático de porcentagem, além de Unidade de Imagem, Kit de Manutenção e dados gerais do equipamento.

        Desenvolvido por Fernando Aranha - fernando@aranha.eti.br


        
      groups:
        -
          name: Templates
      items:
        -
          uuid: f8a4b3c2d1e0489ab000000000000001
          name: 'Fabricante do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.8.2.1.14.1.1
          key: deviceManufacturer
          delay: '3600'
          history: 7d
          trends: '0'
          status: DISABLED
          value_type: CHAR
          description: 'Identificação do fabricante.'
          inventory_link: VENDOR
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000002
          name: '01 Modelo do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: hrDeviceDescr.1
          key: deviceModel
          delay: '30'
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000003
          name: 'Ping da Impressora'
          type: SIMPLE
          key: 'icmpping[,5,,,]'
          delay: 120s
          trends: 90d
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000004
              expression: 'last(/SNMP - Lexmark CX951se/icmpping[,5,,,])=0'
              name: 'Impressora {HOST.NAME} Inacessível'
              priority: HIGH
              description: 'Alarme acionado se a impressora não responder a 5 pacotes de ping'
              manual_close: 'YES'
        -
          uuid: f8a4b3c2d1e0489ab000000000000005
          name: 'Nível da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.1
          key: ImagingUnitCurrentLevel
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000006
              expression: 'last(/SNMP - Lexmark CX951se/ImagingUnitCurrentLevel)<22500'
              name: '{HOST.NAME} - Substituir Unidade de Imagem'
              priority: WARNING
        -
          uuid: f8a4b3c2d1e0489ab000000000000007
          name: 'Capacidade da Unidade de Imagem'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.1
          key: ImagingUnitMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000008
          name: 'Porcentagem da Unidade de Imagem'
          type: CALCULATED
          key: imaging_unit_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//ImagingUnitCurrentLevel) / last(//ImagingUnitMaxCapacity) * 100'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000009
          name: 'Nível do Kit de Manutenção'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.3
          key: MaintenanceKitCurrentLevel
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000a
          name: 'Capacidade do Kit de Manutenção'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.3
          key: MaintenanceKitMaxCapacity
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000b
          name: 'Porcentagem do Kit de Manutenção'
          type: CALCULATED
          key: maintenance_kit_percentage
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//MaintenanceKitCurrentLevel) / last(//MaintenanceKitMaxCapacity) * 100'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000c
          name: 'Status da Impressora'
          type: SNMP_AGENT
          snmp_oid: hrPrinterStatus.1
          key: prtConsoleDescription
          delay: '60'
          history: 7d
          trends: '0'
          value_type: CHAR
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000d
          name: 'Contador de Páginas'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.10.2.1.4.1.1
          key: prtMarkerLifeCount
          delay: '60'
          trends: '0'
          value_type: LOG
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000e
          name: 'Nível do Toner (PRETO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.2
          key: prtMarkerSuppliesLevel_Black
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000000f
          name: 'Capacidade do Toner (PRETO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.2
          key: prtMarkerSuppliesMaxCapacity_Black
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000010
          name: 'Porcentagem do Toner (PRETO)'
          type: CALCULATED
          key: toner_percentage_black
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Black) / last(//prtMarkerSuppliesMaxCapacity_Black) * 100'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000011
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_black)<10'
              name: '{HOST.NAME} - Nível de Toner PRETO abaixo de 10%'
              priority: WARNING
        -
          uuid: f8a4b3c2d1e0489ab000000000000012
          name: 'Nível do Toner (CIANO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.3
          key: prtMarkerSuppliesLevel_Cyan
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000013
          name: 'Capacidade do Toner (CIANO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.3
          key: prtMarkerSuppliesMaxCapacity_Cyan
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000014
          name: 'Porcentagem do Toner (CIANO)'
          type: CALCULATED
          key: toner_percentage_cyan
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Cyan) / last(//prtMarkerSuppliesMaxCapacity_Cyan) * 100'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000015
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_cyan)<10'
              name: '{HOST.NAME} - Nível de Toner CIANO abaixo de 10%'
              priority: WARNING
        -
          uuid: f8a4b3c2d1e0489ab000000000000016
          name: 'Nível do Toner (MAGENTA)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.4
          key: prtMarkerSuppliesLevel_Magenta
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000017
          name: 'Capacidade do Toner (MAGENTA)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.4
          key: prtMarkerSuppliesMaxCapacity_Magenta
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab000000000000018
          name: 'Porcentagem do Toner (MAGENTA)'
          type: CALCULATED
          key: toner_percentage_magenta
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Magenta) / last(//prtMarkerSuppliesMaxCapacity_Magenta) * 100'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000019
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_magenta)<10'
              name: '{HOST.NAME} - Nível de Toner MAGENTA abaixo de 10%'
              priority: WARNING
        -
          uuid: f8a4b3c2d1e0489ab00000000000001a
          name: 'Nível do Toner (AMARELO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.9.1.5
          key: prtMarkerSuppliesLevel_Yellow
          delay: '60'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000001b
          name: 'Capacidade do Toner (AMARELO)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.11.1.1.8.1.5
          key: prtMarkerSuppliesMaxCapacity_Yellow
          delay: '3600'
          history: 7d
          trends: '0'
          tags:
            -
              tag: Application
              value: Printer
        -
          uuid: f8a4b3c2d1e0489ab00000000000001c
          name: 'Porcentagem do Toner (AMARELO)'
          type: CALCULATED
          key: toner_percentage_yellow
          delay: '60'
          value_type: FLOAT
          units: '%'
          params: 'last(//prtMarkerSuppliesLevel_Yellow) / last(//prtMarkerSuppliesMaxCapacity_Yellow) * 100'
          tags:
            -
              tag: Application
              value: Printer
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab00000000000001d
              expression: 'last(/SNMP - Lexmark CX951se/toner_percentage_yellow)<10'
              name: '{HOST.NAME} - Nível de Toner AMARELO abaixo de 10%'
              priority: WARNING
        -
          uuid: f8a4b3c2d1e0489ab00000000000001e
          name: '05 Número de Série do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.5.1.1.17.1
          key: serialNumber
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: SERIALNO_A
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab00000000000001f
          name: '03 Contato do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysContact.0'
          key: sysContact
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Identificação textual do contato do dispositivo.'
          inventory_link: CONTACT
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000020
          name: 'Descrição do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysDescr.0'
          key: sysDescr
          delay: '3600'
          history: 7d
          trends: '0'
          status: DISABLED
          value_type: CHAR
          inventory_link: HARDWARE
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000021
          name: '02 Localização do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysLocation.0'
          key: sysLocation
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'A localização física deste nó.'
          inventory_link: LOCATION
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000022
          name: '04 Nome do Dispositivo'
          type: SNMP_AGENT
          snmp_oid: 'SNMPv2-MIB::sysName.0'
          key: sysName
          delay: '3600'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Nome administrativamente atribuído a este dispositivo.'
          inventory_link: NAME
          tags:
            -
              tag: Application
              value: General
        -
          uuid: f8a4b3c2d1e0489ab000000000000023
          name: '06 Tempo de Atividade (Uptime)'
          type: SNMP_AGENT
          snmp_oid: 'DISMAN-EVENT-MIB::sysUpTimeInstance'
          key: sysUpTime
          delay: '60'
          units: uptime
          description: 'Tempo desde que a máquina foi ligada/reiniciada.'
          preprocessing:
            -
              type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            -
              tag: Application
              value: General
          triggers:
            -
              uuid: f8a4b3c2d1e0489ab000000000000024
              expression: 'change(/SNMP - Lexmark CX951se/sysUpTime)<0'
              name: 'Impressora {HOST.NAME} reiniciada'
              priority: INFO
  graphs:
    -
      uuid: f8a4b3c2d1e0489ab000000000000025
      name: 'Níveis dos Toners (Porcentagem)'
      graph_items:
        -
          color: '000000'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_black
        -
          sortorder: '1'
          color: '00FFFF'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_cyan
        -
          sortorder: '2'
          color: 'FF00FF'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_magenta
        -
          sortorder: '3'
          color: 'FFFF00'
          item:
            host: 'SNMP - Lexmark CX951se'
            key: toner_percentage_yellow
